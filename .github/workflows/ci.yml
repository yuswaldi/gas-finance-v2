name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev
  pull_request:
    branches:
      - main
      - develop
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Syntax, and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CI dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Apps Script manifest JSON
        run: |
          node -e "
            const manifest = JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'));
            if (!manifest.timeZone || !manifest.runtimeVersion) {
              console.error('Missing mandatory fields in appsscript.json');
              process.exit(1);
            }
            console.log('✓ appsscript.json is valid JSON with required runtime settings');
          "

      - name: Validate JavaScript and Apps Script syntax
        run: npm run syntax:check

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test
